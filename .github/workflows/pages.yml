# GENERATED by scripts/export_demo.py in the private repo.
#
# Set Settings -> Pages -> Source to "GitHub Actions" once, by hand; that is not
# something a workflow can do for itself.
name: Deploy the report card to Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The lockfile is committed, so the build resolves the same tree twice.
      - run: npm ci

      # BUILD FIRST, and the order is not cosmetic. Next 16 generates the route
      # types -- `LayoutProps<"/">`, which layout.tsx uses -- into `.next/types`
      # during a build, so on a fresh clone `tsc --noEmit` fails with
      # "Cannot find name 'LayoutProps'" until one has run. Writes web/out/,
      # under basePath /training-demo.
      - run: npm run build

      # typecheck + lint + both vitest projects, against the committed records.
      - run: npm run check

      - uses: actions/configure-pages@v5

      # `path` is workspace-relative: `defaults.run.working-directory` applies
      # to `run` steps only, not to an action's inputs.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
